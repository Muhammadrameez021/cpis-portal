<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PK Finance Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--blue:#1F6FEB;--blue-bg:#EBF2FF;
  --green:#1E7D34;--green-bg:#E8F5EB;--green-br:#B8DFBF;
  --red:#A01E1E;--red-bg:#FFE8E8;--red-br:#F5ABAB;
  --amber:#A05C00;--amber-bg:#FFF3DC;--amber-br:#F5C97A;
  --purple:#7C3AED;--purple-bg:#F3EFFE;
  --text:#1A1A2E;--text2:#555577;--text3:#8B8BAA;
  --border:#CBD5E1;--border2:#E2E8F0;
  --bg:#F0F4F8;--surface:#fff;--surface2:#F8FAFB;
  --radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:1.5rem 1rem}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#1B3A6B,#1F6FEB);border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center}
.brand-name{font-size:18px;font-weight:800;color:#fff}
.brand-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.month-sel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;outline:none}
.month-sel option{background:#1B3A6B;color:#fff}

/* SUMMARY CARDS */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.scard{background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);padding:1.1rem 1.25rem;box-shadow:0 2px 8px rgba(31,111,235,.05)}
.sc-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sc-val{font-size:28px;font-weight:800;line-height:1}
.sc-sub{font-size:11px;color:var(--text3);margin-top:4px}
.sc-income{border-left:4px solid var(--green)}
.sc-expense{border-left:4px solid var(--red)}
.sc-balance{border-left:4px solid var(--blue)}

/* PROGRESS BAR */
.prog-wrap{margin-top:8px}
.prog-bar{height:6px;background:var(--border2);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--radius);padding:4px;margin-bottom:1.25rem}
.tab{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);text-align:center;transition:all .2s}
.tab.on{background:linear-gradient(135deg,#1B3A6B,#1F6FEB);color:#fff;box-shadow:0 2px 8px rgba(31,111,235,.3)}
.panel{display:none}.panel.on{display:block}

/* FORM */
.form-card{background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem;box-shadow:0 2px 8px rgba(31,111,235,.05)}
.form-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:1rem;display:flex;align-items:center;gap:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
input.fi,select.fi,textarea.fi{width:100%;padding:10px 14px;font-size:14px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);outline:none;transition:border .2s}
input.fi:focus,select.fi:focus{border-color:var(--blue);background:#fff}
textarea.fi{resize:none;height:60px}
.type-btns{display:flex;gap:8px}
.type-btn{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .2s;text-align:center}
.type-btn.income.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.type-btn.expense.on{background:var(--red-bg);border-color:var(--red-br);color:var(--red)}
.add-btn{width:100%;padding:12px;font-size:14px;font-weight:700;border-radius:10px;border:none;background:linear-gradient(135deg,#1B3A6B,#1F6FEB);color:#fff;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:7px}
.add-btn:hover{opacity:.9}

/* TRANSACTIONS */
.tx-list{background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(31,111,235,.05)}
.tx-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border2);background:var(--surface2)}
.tx-title{font-size:13px;font-weight:700;color:var(--navy)}
.tx-filter{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text2);outline:none;cursor:pointer}
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 1.25rem;border-bottom:1px solid var(--border2);transition:background .2s}
.tx-row:last-child{border-bottom:none}
.tx-row:hover{background:var(--blue-bg)}
.tx-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-cat{font-size:11px;color:var(--text3);margin-top:2px}
.tx-date{font-size:11px;color:var(--text3);text-align:right;margin-right:8px;white-space:nowrap}
.tx-amt{font-size:14px;font-weight:700;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:6px;font-size:16px;opacity:0;transition:opacity .2s}
.tx-row:hover .tx-del{opacity:1}
.tx-del:hover{color:var(--red);background:var(--red-bg)}
.empty-state{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}

/* CHARTS */
.chart-card{background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);padding:1.25rem;box-shadow:0 2px 8px rgba(31,111,235,.05);margin-bottom:1.25rem}
.chart-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:1rem;display:flex;align-items:center;gap:7px}
.chart-wrap{position:relative;height:220px}

/* CATEGORIES */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
.cat-card{background:#fff;border:1.5px solid var(--border2);border-radius:10px;padding:.85rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cat-name{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:6px}
.cat-amt{font-size:13px;font-weight:700;color:var(--red)}
.cat-bar{height:5px;background:var(--border2);border-radius:3px;overflow:hidden}
.cat-fill{height:100%;border-radius:3px;background:var(--red)}

/* SAVINGS GOAL */
.goal-card{background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);padding:1.25rem;box-shadow:0 2px 8px rgba(31,111,235,.05);margin-bottom:1.25rem}
.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.goal-title{font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px}
.goal-add-btn{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid #B8D4F5;border-radius:7px;padding:5px 10px;cursor:pointer}
.goal-item{padding:.85rem 0;border-bottom:1px solid var(--border2)}
.goal-item:last-child{border-bottom:none}
.goal-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.goal-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px}
.goal-prog{height:8px;background:var(--border2);border-radius:4px;overflow:hidden}
.goal-prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1F6FEB,#1B3A6B);transition:width .5s}

/* BDGS */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}
.bdg-g{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.bdg-r{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.75rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:1.25rem}
.modal-btns{display:flex;gap:8px;margin-top:1.25rem}
.mbtn{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.mbtn-cancel{background:var(--surface2);color:var(--text2)}
.mbtn-save{background:linear-gradient(135deg,#1B3A6B,#1F6FEB);color:#fff}

@media(max-width:640px){.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.cat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><i class="ti ti-wallet" style="font-size:22px;color:#fff"></i></div>
    <div>
      <div class="brand-name">PK Finance Tracker</div>
      <div class="brand-sub">Personal budget & expense manager</div>
    </div>
  </div>
  <select class="month-sel" id="monthSel" onchange="render()"></select>
</div>

<!-- SUMMARY -->
<div class="g3">
  <div class="scard sc-income">
    <div class="sc-label"><i class="ti ti-arrow-down-circle" style="color:var(--green)"></i>Total Income</div>
    <div class="sc-val" id="totalIncome" style="color:var(--green)">PKR 0</div>
    <div class="sc-sub" id="incomeCount">0 transactions</div>
  </div>
  <div class="scard sc-expense">
    <div class="sc-label"><i class="ti ti-arrow-up-circle" style="color:var(--red)"></i>Total Expenses</div>
    <div class="sc-val" id="totalExpense" style="color:var(--red)">PKR 0</div>
    <div class="sc-sub" id="expenseCount">0 transactions</div>
  </div>
  <div class="scard sc-balance">
    <div class="sc-label"><i class="ti ti-cash" style="color:var(--blue)"></i>Balance</div>
    <div class="sc-val" id="balance" style="color:var(--blue)">PKR 0</div>
    <div class="prog-wrap">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3)"><span>Spent</span><span id="spentPct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="spentBar" style="width:0%;background:var(--blue)"></div></div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab on" onclick="swTab('add',this)"><i class="ti ti-plus" style="font-size:14px;margin-right:4px"></i>Add</button>
  <button class="tab" onclick="swTab('transactions',this)"><i class="ti ti-list" style="font-size:14px;margin-right:4px"></i>Transactions</button>
  <button class="tab" onclick="swTab('analytics',this)"><i class="ti ti-chart-bar" style="font-size:14px;margin-right:4px"></i>Analytics</button>
  <button class="tab" onclick="swTab('goals',this)"><i class="ti ti-target" style="font-size:14px;margin-right:4px"></i>Goals</button>
</div>

<!-- ADD PANEL -->
<div class="panel on" id="p-add">
  <div class="form-card">
    <div class="form-title"><i class="ti ti-plus-circle" style="color:var(--blue)"></i>Add Transaction</div>
    <div class="type-btns" style="margin-bottom:12px">
      <div class="type-btn income on" id="btn-income" onclick="setType('income')"><i class="ti ti-arrow-down-circle"></i> Income</div>
      <div class="type-btn expense" id="btn-expense" onclick="setType('expense')"><i class="ti ti-arrow-up-circle"></i> Expense</div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="fl">Amount (PKR)</label>
        <input class="fi" type="number" id="fAmt" placeholder="e.g. 50000" min="0">
      </div>
      <div class="form-group">
        <label class="fl">Category</label>
        <select class="fi" id="fCat"></select>
      </div>
      <div class="form-group">
        <label class="fl">Description</label>
        <input class="fi" type="text" id="fDesc" placeholder="e.g. Monthly salary">
      </div>
      <div class="form-group">
        <label class="fl">Date</label>
        <input class="fi" type="date" id="fDate">
      </div>
    </div>
    <button class="add-btn" onclick="addTx()"><i class="ti ti-plus" style="font-size:16px"></i>Add Transaction</button>
  </div>
</div>

<!-- TRANSACTIONS PANEL -->
<div class="panel" id="p-transactions">
  <div class="tx-list">
    <div class="tx-header">
      <div class="tx-title" id="txTitle">All Transactions</div>
      <select class="tx-filter" id="txFilter" onchange="renderTx()">
        <option value="all">All</option>
        <option value="income">Income only</option>
        <option value="expense">Expense only</option>
      </select>
    </div>
    <div id="txBody"></div>
  </div>
</div>

<!-- ANALYTICS PANEL -->
<div class="panel" id="p-analytics">
  <div class="g2">
    <div class="chart-card">
      <div class="chart-title"><i class="ti ti-chart-donut" style="color:var(--blue)"></i>Income vs Expense</div>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title"><i class="ti ti-chart-bar" style="color:var(--blue)"></i>Monthly Overview</div>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
  </div>
  <div class="form-title" style="margin-bottom:.75rem"><i class="ti ti-category" style="color:var(--red)"></i> Expense by Category</div>
  <div class="cat-grid" id="catGrid"></div>
</div>

<!-- GOALS PANEL -->
<div class="panel" id="p-goals">
  <div class="goal-card">
    <div class="goal-header">
      <div class="goal-title"><i class="ti ti-target" style="color:var(--blue)"></i>Savings Goals</div>
      <button class="goal-add-btn" onclick="showGoalModal()"><i class="ti ti-plus"></i> Add Goal</button>
    </div>
    <div id="goalList"></div>
  </div>
</div>

</div>

<!-- GOAL MODAL -->
<div class="modal-bg" id="goalModal">
  <div class="modal">
    <div class="modal-title">Add Savings Goal</div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="fl">Goal Name</label>
      <input class="fi" type="text" id="gName" placeholder="e.g. Eid shopping, New phone">
    </div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="fl">Target Amount (PKR)</label>
      <input class="fi" type="number" id="gTarget" placeholder="e.g. 50000">
    </div>
    <div class="form-group">
      <label class="fl">Saved so far (PKR)</label>
      <input class="fi" type="number" id="gSaved" placeholder="e.g. 10000">
    </div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="hideGoalModal()">Cancel</button>
      <button class="mbtn mbtn-save" onclick="saveGoal()">Save Goal</button>
    </div>
  </div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────
var CATS = {
  income: ['Salary','Freelance','Business','Rent Income','Bonus','Other Income'],
  expense: ['Ration/Grocery','Rent','Bijli (Electricity)','Gas','Water','Transport','Petrol','School Fees','Medical','Mobile/Internet','Clothes','Restaurant/Food','Rickshaw/Uber','Household','Entertainment','Savings','Other']
};

var CAT_ICONS = {
  'Salary':'💼','Freelance':'💻','Business':'🏪','Rent Income':'🏠','Bonus':'🎁','Other Income':'💰',
  'Ration/Grocery':'🛒','Rent':'🏠','Bijli (Electricity)':'💡','Gas':'🔥','Water':'💧','Transport':'🚌',
  'Petrol':'⛽','School Fees':'📚','Medical':'🏥','Mobile/Internet':'📱','Clothes':'👕','Restaurant/Food':'🍽️',
  'Rickshaw/Uber':'🚗','Household':'🏡','Entertainment':'🎬','Savings':'🏦','Other':'📌'
};

var CAT_COLORS = ['#1F6FEB','#1E7D34','#7C3AED','#A05C00','#0D7377','#A01E1E','#1B3A6B','#D97706','#059669','#DC2626','#7C3AED','#2563EB'];

function loadData(){
  try{
    var raw = localStorage.getItem('pkft_data');
    if(!raw) return {txs:[],goals:[]};
    var parsed = JSON.parse(raw);
    if(!parsed.txs) parsed.txs = [];
    if(!parsed.goals) parsed.goals = [];
    return parsed;
  }catch(e){return {txs:[],goals:[]};}
}
function saveData(d){
  try{
    localStorage.setItem('pkft_data', JSON.stringify(d));
  }catch(e){
    console.error('Save failed:', e);
  }
}

var DB = loadData();
var curType = 'income';
var pieC = null, barC = null;

// ── INIT ────────────────────────────────────────────────────
function init(){
  // Month selector
  var sel = document.getElementById('monthSel');
  var now = new Date();
  for(var i=0;i<12;i++){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var val = d.getFullYear()+'-'+(d.getMonth()+1);
    var lbl = d.toLocaleString('default',{month:'long',year:'numeric'});
    var opt = document.createElement('option');
    opt.value=val; opt.textContent=lbl;
    sel.appendChild(opt);
  }
  // Set today date
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  setType('income');
  render();
}

function getCurMonth(){
  return document.getElementById('monthSel').value;
}

function getTxs(month){
  return DB.txs.filter(function(t){
    var d = new Date(t.date);
    return (d.getFullYear()+'-'+(d.getMonth()+1)) === month;
  });
}

// ── FORMAT ──────────────────────────────────────────────────
function fmt(n){
  return 'PKR '+Number(n).toLocaleString('en-PK');
}

// ── TYPE ────────────────────────────────────────────────────
function setType(t){
  curType = t;
  document.getElementById('btn-income').classList.toggle('on', t==='income');
  document.getElementById('btn-expense').classList.toggle('on', t==='expense');
  var sel = document.getElementById('fCat');
  sel.innerHTML = CATS[t].map(function(c){return '<option>'+c+'</option>';}).join('');
}

// ── ADD TX ──────────────────────────────────────────────────
function addTx(){
  var amtEl = document.getElementById('fAmt');
  var catEl = document.getElementById('fCat');
  var descEl = document.getElementById('fDesc');
  var dateEl = document.getElementById('fDate');
  
  var amt = parseFloat(amtEl.value);
  var cat = catEl ? catEl.value : '';
  var desc = descEl ? descEl.value.trim() : '';
  var date = dateEl ? dateEl.value : '';
  
  if(!amt||isNaN(amt)||amt<=0){alert('Please enter a valid amount');return;}
  if(!date){alert('Please select a date');return;}
  if(!cat){alert('Please select a category');return;}
  
  var tx = {id:Date.now(),type:curType,amt:amt,cat:cat,desc:desc||cat,date:date};
  
  if(!DB.txs) DB.txs = [];
  DB.txs.unshift(tx);
  saveData(DB);
  
  amtEl.value='';
  if(descEl) descEl.value='';
  
  // Show success
  var btn = document.querySelector('.add-btn');
  var orig = btn.innerHTML;
  btn.innerHTML = '<i class="ti ti-check" style="font-size:16px"></i> Added!';
  btn.style.background = '#1E7D34';
  setTimeout(function(){
    btn.innerHTML = orig;
    btn.style.background = '';
  }, 1500);
  
  render();
}

// ── RENDER ──────────────────────────────────────────────────
function render(){
  var month = getCurMonth();
  var txs = getTxs(month);
  var income = txs.filter(function(t){return t.type==='income';}).reduce(function(a,t){return a+t.amt;},0);
  var expense = txs.filter(function(t){return t.type==='expense';}).reduce(function(a,t){return a+t.amt;},0);
  var balance = income - expense;
  var pct = income>0?Math.min(100,Math.round(expense/income*100)):0;

  document.getElementById('totalIncome').textContent=fmt(income);
  document.getElementById('totalExpense').textContent=fmt(expense);
  document.getElementById('balance').textContent=fmt(balance);
  document.getElementById('balance').style.color=balance>=0?'var(--green)':'var(--red)';
  document.getElementById('incomeCount').textContent=txs.filter(function(t){return t.type==='income';}).length+' transactions';
  document.getElementById('expenseCount').textContent=txs.filter(function(t){return t.type==='expense';}).length+' transactions';
  document.getElementById('spentPct').textContent=pct+'%';
  document.getElementById('spentBar').style.width=pct+'%';
  document.getElementById('spentBar').style.background=pct>90?'var(--red)':pct>70?'var(--amber)':'var(--blue)';

  renderTx();
  renderAnalytics();
  renderGoals();
}

function renderTx(){
  var month = getCurMonth();
  var txs = getTxs(month);
  var filter = document.getElementById('txFilter').value;
  if(filter!=='all') txs=txs.filter(function(t){return t.type===filter;});
  var body = document.getElementById('txBody');
  document.getElementById('txTitle').textContent = txs.length+' transactions';
  if(!txs.length){
    body.innerHTML='<div class="empty-state"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>No transactions this month</div>';
    return;
  }
  body.innerHTML = txs.map(function(t){
    var isInc = t.type==='income';
    var icon = CAT_ICONS[t.cat]||'📌';
    var bg = isInc?'#E8F5EB':'#FFE8E8';
    return '<div class="tx-row">'+
      '<div class="tx-icon" style="background:'+bg+'">'+icon+'</div>'+
      '<div class="tx-info"><div class="tx-name">'+t.desc+'</div><div class="tx-cat">'+t.cat+'</div></div>'+
      '<div class="tx-date">'+new Date(t.date).toLocaleDateString('en-PK',{day:'numeric',month:'short'})+'</div>'+
      '<div class="tx-amt" style="color:'+(isInc?'var(--green)':'var(--red)')+'">'+
        (isInc?'+':'-')+fmt(t.amt)+'</div>'+
      '<button class="tx-del" onclick="delTx('+t.id+')"><i class="ti ti-trash"></i></button>'+
    '</div>';
  }).join('');
}

function delTx(id){
  if(!confirm('Delete this transaction?'))return;
  DB.txs = DB.txs.filter(function(t){return t.id!==id;});
  saveData(DB);
  render();
}

function renderAnalytics(){
  var month = getCurMonth();
  var txs = getTxs(month);
  var income = txs.filter(function(t){return t.type==='income';}).reduce(function(a,t){return a+t.amt;},0);
  var expense = txs.filter(function(t){return t.type==='expense';}).reduce(function(a,t){return a+t.amt;},0);

  // Pie chart
  if(pieC)pieC.destroy();
  var pieCtx = document.getElementById('pieChart');
  if(income>0||expense>0){
    pieC = new Chart(pieCtx,{
      type:'doughnut',
      data:{labels:['Income','Expenses'],datasets:[{data:[income,expense],backgroundColor:['#1E7D34','#A01E1E'],borderWidth:0,hoverOffset:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},color:'#555577'}}}}
    });
  }

  // Bar chart - last 6 months
  var months=[], mInc=[], mExp=[];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(),now.getMonth()-i,1);
    var mk = d.getFullYear()+'-'+(d.getMonth()+1);
    var mtxs = DB.txs.filter(function(t){var td=new Date(t.date);return (td.getFullYear()+'-'+(td.getMonth()+1))===mk;});
    months.push(d.toLocaleString('default',{month:'short'}));
    mInc.push(mtxs.filter(function(t){return t.type==='income';}).reduce(function(a,t){return a+t.amt;},0));
    mExp.push(mtxs.filter(function(t){return t.type==='expense';}).reduce(function(a,t){return a+t.amt;},0));
  }
  if(barC)barC.destroy();
  barC = new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'Income',data:mInc,backgroundColor:'rgba(30,125,52,.7)',borderRadius:6},
      {label:'Expense',data:mExp,backgroundColor:'rgba(160,30,30,.7)',borderRadius:6}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},color:'#555577'}}},
      scales:{y:{ticks:{color:'#8B8BAA',font:{size:10},callback:function(v){return 'PKR '+v.toLocaleString();}},grid:{color:'#E2E8F0'}},
        x:{ticks:{color:'#8B8BAA',font:{size:11}},grid:{display:false}}}}
  });

  // Category breakdown
  var expTxs = txs.filter(function(t){return t.type==='expense';});
  var catMap = {};
  expTxs.forEach(function(t){catMap[t.cat]=(catMap[t.cat]||0)+t.amt;});
  var cats = Object.keys(catMap).sort(function(a,b){return catMap[b]-catMap[a];});
  var maxAmt = cats.length?catMap[cats[0]]:1;
  document.getElementById('catGrid').innerHTML = cats.length?cats.map(function(cat,i){
    var pct = Math.round(catMap[cat]/maxAmt*100);
    return '<div class="cat-card">'+
      '<div class="cat-top">'+
        '<div class="cat-name"><span>'+( CAT_ICONS[cat]||'📌')+'</span>'+cat+'</div>'+
        '<div class="cat-amt">'+fmt(catMap[cat])+'</div>'+
      '</div>'+
      '<div class="cat-bar"><div class="cat-fill" style="width:'+pct+'%;background:'+CAT_COLORS[i%CAT_COLORS.length]+'"></div></div>'+
    '</div>';
  }).join(''):'<div style="grid-column:1/-1;text-align:center;color:var(--text3);padding:1rem;font-size:13px">No expense data this month</div>';
}

function renderGoals(){
  var list = document.getElementById('goalList');
  if(!DB.goals||!DB.goals.length){
    list.innerHTML='<div class="empty-state"><i class="ti ti-target" style="font-size:28px;display:block;margin-bottom:8px"></i>No goals yet. Add your first savings goal!</div>';
    return;
  }
  list.innerHTML = DB.goals.map(function(g,i){
    var pct = Math.min(100,Math.round(g.saved/g.target*100));
    return '<div class="goal-item">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
        '<div class="goal-name">'+g.name+'</div>'+
        '<button onclick="delGoal('+i+')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px"><i class="ti ti-trash"></i></button>'+
      '</div>'+
      '<div class="goal-meta">'+
        '<span>Saved: <strong style="color:var(--green)">'+fmt(g.saved)+'</strong></span>'+
        '<span>Target: <strong>'+fmt(g.target)+'</strong></span>'+
        '<span style="color:var(--blue);font-weight:700">'+pct+'%</span>'+
      '</div>'+
      '<div class="goal-prog"><div class="goal-prog-fill" style="width:'+pct+'%"></div></div>'+
    '</div>';
  }).join('');
}

// ── GOALS ───────────────────────────────────────────────────
function showGoalModal(){document.getElementById('goalModal').classList.add('on');}
function hideGoalModal(){document.getElementById('goalModal').classList.remove('on');}
function saveGoal(){
  var name=document.getElementById('gName').value.trim();
  var target=parseFloat(document.getElementById('gTarget').value)||0;
  var saved=parseFloat(document.getElementById('gSaved').value)||0;
  if(!name||!target){alert('Please fill name and target amount');return;}
  if(!DB.goals)DB.goals=[];
  DB.goals.push({name:name,target:target,saved:saved});
  saveData(DB);
  hideGoalModal();
  document.getElementById('gName').value='';
  document.getElementById('gTarget').value='';
  document.getElementById('gSaved').value='';
  renderGoals();
}
function delGoal(i){
  if(!confirm('Delete this goal?'))return;
  DB.goals.splice(i,1);
  saveData(DB);
  renderGoals();
}

// ── TABS ────────────────────────────────────────────────────
function swTab(id,btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('p-'+id).classList.add('on');
  if(id==='analytics')renderAnalytics();
}

init();
</script>
</body>
</html>
